name: Unit Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  unit-tests:
    name: bash unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Syntax check
      run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
    - name: Run unit tests
      run: ./tests/run-tests.sh
