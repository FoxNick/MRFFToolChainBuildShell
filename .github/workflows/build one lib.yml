# https://github.com/actions/runner-images

on:
  # push:
  #   branches: [master]
  workflow_dispatch:
    inputs:
      os:
        description: 'macos version'
        required: false
        type: choice
        default: 'macos-15'
        options:
          - macos-13
          - macos-14
          - macos-15
          - macos-26
      platform:
        description: 'choose a platform for compile'
        required: false
        type: choice
        default: 'all'
        options:
          - apple
          - android
          - all
          - ios
          - tvos
          - macos
      dryrun:
        description: 'just run workflow,but not deploy'
        required: false
        type: choice
        default: 'false'
        options:
          - true
          - false
      verbose:
        description: 'print detail logs'
        required: false
        type: choice
        default: 'false'
        options:
          - true
          - false
      lib:
        description: 'choose a lib for compile'
        required: true
        type: choice
        default: 'ffmpeg7'
        options:
          - ffmpeg8
          - ffmpeg7
          - ffmpeg6
          - ffmpeg5
          - ffmpeg4
          - ijkffmpeg
          - fftutorial
          - ass
          - bluray
          - dav1d
          - dvdread
          - dvdnav
          - harfbuzz
          - fontconfig
          - freetype
          - fribidi
          - lcms2
          - placebo
          - moltenvk
          - openssl3
          - openssl
          - opus
          - shaderc
          - smb2
          - soundtouch
          - uavs3d
          - unibreak
          - yuv
          - xml2
          - webp
          - dovi
  pull_request:
    branches: [master]

name: build a lib

# only contents is needed: push the upgraded lib config and create the release
permissions:
  contents: write

jobs:
  build:
    name: compile ${{ inputs.lib }} for ${{ inputs.platform }} then deploy
    runs-on: ${{ inputs.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: nttld/setup-ndk@2817442ee7c3346c1eb7d2ec60263c93206ba14f # v1
      id: setup-ndk
      with:
        ndk-version: r27c
        add-to-path: true
        local-cache: false
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install cargo-c
      if: inputs.lib == 'dovi'
      run: cargo install cargo-c
    - name: Install dependencies
      run: .github/workflows/install-dependencies.sh "$INPUT_LIB" "$INPUT_PLATFORM"
      env:
        INPUT_LIB: ${{ inputs.lib }}
        INPUT_PLATFORM: ${{ inputs.platform }}
    - name: One Step
      run: .github/workflows/onestep.sh "$INPUT_LIB" "$INPUT_PLATFORM" "$INPUT_DRYRUN" "$INPUT_VERBOSE"
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        INPUT_LIB: ${{ inputs.lib }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_DRYRUN: ${{ github.event_name == 'pull_request' && 'true' || inputs.dryrun }}