on:
  # push:
  #   branches: [master]
  workflow_dispatch:
  pull_request:
    branches: [master]

name: Test Release

# only contents is needed: push the upgraded lib config and create the release
permissions:
  contents: write

jobs:
  build:
    name: compile none then deploy
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install cargo-c
      run: cargo install cargo-c
    - name: One Step
      run: .github/workflows/onestep.sh test all "$DRY_RUN"
      env:
        DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}